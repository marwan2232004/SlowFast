TRAIN:
  ENABLE: False                # no training in demo
  DATASET: ava
  BATCH_SIZE: 64
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: True
  CHECKPOINT_FILE_PATH: ./checkpoints/SLOWFAST_custom.pyth  # <-- your trained model
  CHECKPOINT_TYPE: pytorch     # your trained weights are in PyTorch format

DATA:
  NUM_FRAMES: 32
  SAMPLING_RATE: 2
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 256          # must match training
  INPUT_CHANNEL_NUM: [3, 3]

DETECTION:
  ENABLE: True
  ALIGNED: True


SLOWFAST:
  ALPHA: 4
  BETA_INV: 8
  FUSION_CONV_CHANNEL_RATIO: 2
  FUSION_KERNEL_SZ: 5         # same as training

RESNET:
  ZERO_INIT_FINAL_BN: True
  WIDTH_PER_GROUP: 64
  NUM_GROUPS: 1
  DEPTH: 101
  TRANS_FUNC: bottleneck_transform
  STRIDE_1X1: False
  NUM_BLOCK_TEMP_KERNEL: [[3, 3], [4, 4], [6, 6], [3, 3]]
  SPATIAL_DILATIONS: [[1, 1], [1, 1], [1, 1], [2, 2]]
  SPATIAL_STRIDES: [[1, 1], [2, 2], [2, 2], [1, 1]]

NONLOCAL:
  LOCATION: [[[], []], [[], []], [[6, 13, 20], []], [[], []]]
  GROUP: [[1, 1], [1, 1], [1, 1], [1, 1]]
  INSTANTIATION: dot_product
  POOL: [[[2, 2, 2], [2, 2, 2]], [[2, 2, 2], [2, 2, 2]], [[2, 2, 2], [2, 2, 2]], [[2, 2, 2], [2, 2, 2]]]

BN:
  USE_PRECISE_STATS: False
  NUM_BATCHES_PRECISE: 200


MODEL:
  NUM_CLASSES: 80
  ARCH: slowfast
  MODEL_NAME: SlowFast
  LOSS_FUNC: bce
  DROPOUT_RATE: 0.5
  HEAD_ACT: sigmoid

TEST:
  ENABLE: False             
  DATASET: ava
  BATCH_SIZE: 8

DATA_LOADER:
  NUM_WORKERS: 2
  PIN_MEMORY: True

NUM_GPUS: 1   
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: .

TENSORBOARD:
  MODEL_VIS:
    TOPK_PREDS: 2

DEMO:
  ENABLE: True
  LABEL_FILE_PATH: ./ava_classnames.json   # <-- add your label mapping here
  WEBCAM: -1
  DETECTRON2_CFG: "COCO-Detection/faster_rcnn_R_101_FPN_3x.yaml"
  DETECTRON2_WEIGHTS: detectron2://COCO-Detection/faster_rcnn_R_101_FPN_3x/137851257/model_final_f6e8b1.pkl
  COMMON_CLASS_NAMES: ["work-stand",
    "not-work-stand",
    "work-fix",
    "not-work-sit"]
